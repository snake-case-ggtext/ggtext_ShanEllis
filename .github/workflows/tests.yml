name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} / mpl ${{ matrix.matplotlib }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # matplotlib 3.11 requires Python >= 3.11, so Python 3.10 is
          # tested against matplotlib 3.10. Image comparisons run only on
          # Linux + matplotlib 3.11 (see tests/image_compare.py).
          - { os: ubuntu-latest, python: "3.10", matplotlib: "3.10.*" }
          - { os: ubuntu-latest, python: "3.11", matplotlib: "3.11.*" }
          - { os: ubuntu-latest, python: "3.12", matplotlib: "3.11.*" }
          - { os: ubuntu-latest, python: "3.13", matplotlib: "3.11.*" }
          - { os: macos-latest, python: "3.13", matplotlib: "3.11.*" }
          - { os: windows-latest, python: "3.13", matplotlib: "3.11.*" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "matplotlib==${{ matrix.matplotlib }}"
      - name: Test
        run: python -m pytest --cov=ggtext --cov-report=term-missing
      - name: Doctests
        run: python -m pytest --doctest-modules src/ggtext
      - name: Upload image test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: result-images-py${{ matrix.python }}-${{ matrix.os }}
          path: tests/result_images
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
