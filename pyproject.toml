[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ggtext"
version = "0.1.0"
description = "Rich text (Markdown, HTML, CSS) for matplotlib and plotnine — a Python take on R's ggtext"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shannon E. Ellis" }]
keywords = ["matplotlib", "plotnine", "ggplot", "markdown", "rich text", "visualization", "ggtext"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
# matplotlib 3.11 needs Python >= 3.11; on Python 3.10 you get matplotlib 3.10.
dependencies = [
    # ggIR parses markdown/HTML/CSS (and brings in markdown-it-py)
    "ggir @ git+https://github.com/snake-case-ggtext/ggIR@v0.3.0",
    "matplotlib>=3.10",
    "numpy>=1.23",
    "plotnine>=0.15,<0.16",
    "pandas",
]

# Installed by default with `uv sync` (and `make install`).
[dependency-groups]
test = ["pytest>=7", "pytest-cov", "pytest-randomly"]
docs = ["jupyter", "nbconvert"]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "ruff",
    "prek",
    "pyrefly",
]

[project.urls]
Documentation = "https://github.com/snake-case-ggtext/ggtext_ShanEllis/tree/main/docs"
Source = "https://github.com/snake-case-ggtext/ggtext_ShanEllis"
"R ggtext" = "https://wilkelab.org/ggtext/"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ggtext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:ggtext",
]
markers = [
    "plotnine: tests that need plotnine",
    "network: tests that need internet access",
    "examples: run the gallery examples in examples/",
    "notebook: execute the example notebook (needs the 'notebook' extra)",
]

[tool.coverage.run]
source = ["ggtext"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# Ruff runs with its out-of-the-box rules and formatter settings.
[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests", "examples"]
search-path = ["src", "."]
baseline = "pyrefly-baseline.json"
